version: "3.9"

services:

  postgres:
    image: postgres:17
    container_name: scalora-postgres

    restart: always

    environment:
      POSTGRES_DB: scalora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scalora"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - scalora-network



  redis:

    image: redis:7-alpine

    container_name: scalora-redis

    restart: always

    ports:
      - "6379:6379"

    networks:
      - scalora-network



  api:

    build:

      context: .

      dockerfile: infrastructure/docker/api/Dockerfile

    container_name: scalora-api

    restart: always

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/scalora
      SECRET_KEY: change-me-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      APP_ENV: development

    ports:

      - "8000:8000"

    volumes:

      - ./apps/api:/app

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:

      - scalora-network



  web:

    build:

      context: .

      dockerfile: infrastructure/docker/web/Dockerfile

    container_name: scalora-web

    restart: always

    ports:

      - "3000:3000"

    volumes:

      - ./apps/web:/app

    depends_on:

      - api

    networks:

      - scalora-network



volumes:

  postgres_data:



networks:

  scalora-network:

    driver: bridge